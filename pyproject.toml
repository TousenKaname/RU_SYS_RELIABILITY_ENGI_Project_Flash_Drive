[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashrel"
version = "2.0.0"
description = "FlashRel Rig: unattended endurance (copy-verify-delete) life testing of USB flash drives on Windows, with a live web dashboard."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Guoan Wang" }, { name = "Shangqing Wei" }, { name = "Mengtong Ai" }]
dependencies = []            # the rig itself uses the Python standard library only

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
flashrel = "flashrel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flashrel = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = ["slow: end-to-end run of the controller with 20 simulated drives (~1 min)"]
pythonpath = ["src"]
